[workspace]
resolver = "2"
members = ["registry", "escrow", "payment"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.74.0"

[workspace.dependencies]
soroban-sdk = "21.7.2"
# Pin a transitive dependency of soroban-env-host's testutils: newer resolvers
# pick ed25519-dalek 3.x, whose SigningKey::generate API breaks soroban-sdk 21 tests.
ed25519-dalek = "=2.2.0"

# Release profile tuned for Soroban WASM builds
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
